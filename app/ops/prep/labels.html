<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GainzTrain — Print Labels</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- qrcode.js: generates QR codes in the browser (no internet). QR so an iPhone camera can scan the
       label in the Assembly tab — 1D barcodes need a scanner gun; QR works with any phone camera. -->
  <script src="lib/qrcode.min.js"></script>

  <style>
    /* ── SCREEN STYLES (what you see before printing) ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf8;
      padding: 0 0 40px;
      color: #1a1614;
    }

    /* Dashboard-style dark header bar with the GAINZTRAIN wordmark + orange accent. */
    .labels-topbar {
      background: #1a1614; border-bottom: 3px solid #ff6b35;
      padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .labels-logo { font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 1.35rem; letter-spacing: .08em; text-transform: uppercase; line-height: 1; }
    .labels-logo .g { color: #fff; } .labels-logo .t { color: #ff6b35; }
    .labels-topbar .sub { color: #9a908c; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; }

    .screen-header {
      max-width: 900px;
      margin: 22px auto 20px;
      padding: 0 24px;
    }

    .screen-header h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
      margin-bottom: 4px;
    }

    .screen-header p {
      color: #7a7270;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: #ff6b35; color: #fff; }
    .btn-secondary { background: #f0ebe5; color: #3f3f46; border: 1px solid #e2dad0; }

    .label-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      color: #a1a1aa;
      padding: 60px 0;
      font-size: 0.95rem;
      width: 100%;
    }

    /* ── LABEL STYLES (both screen preview and print) ── */
    /*
      Target: Brother DK-1201 die-cut address label, PORTRAIT = 29mm wide × 90mm tall (1.1" × 3.5").
      Screen preview at 96dpi ≈ 110px × 340px. Print size set in @page below (mm) for the QL-820NWB.
    */
    .label {
      width: 110px;
      height: 340px;
      background: #fff;
      border: 1.5px solid #d4d4d8;
      border-radius: 4px;
      padding: 7px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif; /* Arial prints cleanly on thermal */
      overflow: hidden;
    }

    .label-name {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.1;
      color: #000;
      text-align: center;
      width: 100%;
    }

    .label-meal {
      font-size: 9px;
      font-weight: 600;
      color: #333;
      line-height: 1.2;
      margin-top: 3px;
      text-align: center;
      width: 100%;
    }

    /* Compact macro row — single-letter labels fit the narrow 1.1" width. */
    .label-macros {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin-top: 6px;
      width: 100%;
    }

    .macro-chip {
      flex: 1;
      background: #f4f4f5;
      border-radius: 3px;
      padding: 3px 1px;
      text-align: center;
    }

    .macro-chip .macro-label { font-size: 7px; font-weight: 700; color: #71717a; display: block; }
    .macro-chip .macro-value { font-size: 12px; font-weight: 900; color: #000; display: block; line-height: 1.05; }
    .macro-chip .macro-unit { font-size: 6px; color: #71717a; }

    .label-barcode {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* White quiet-zone around the QR so a phone camera locks on reliably. */
    .label-qr { background: #fff; padding: 3px; line-height: 0; }
    .label-qr canvas,
    .label-qr img { display: block; width: 90px !important; height: 90px !important; }

    .label-barcode .meal-id-text {
      font-size: 6px;
      color: #a1a1aa;
      margin-top: 2px;
      font-family: monospace;
    }
    .label-prepped { font-size: 7px; color: #71717a; margin-top: 2px; text-align: center; }

    /* ── PRINT STYLES ── */
    @media print {
      /* Lock the whole print surface to ONE label width. iOS Safari lays the page out at its content
         width then scales it to the paper — any element wider than 29mm (e.g. the header bar) shrinks
         every label to a tiny sliver. Constraining html/body/grid to 29mm makes it print 1:1. */
      html, body {
        width: 29mm;
        background: #fff;
        padding: 0;
        margin: 0;
      }

      /* Hide EVERYTHING that isn't a label so nothing forces the page wide. */
      .labels-topbar, .screen-header { display: none !important; }

      .label-grid {
        display: block;
        width: 29mm;
        max-width: 29mm;
        margin: 0;
        padding: 0;
        gap: 0;
      }

      /*
        One physical Brother DK-1201 label per page. In the print dialog pick the DK-1201
        (29mm x 90mm / 1.1" x 3.5") label size, margins None, scale 100%, and turn OFF
        headers/footers so nothing shifts the layout.
      */
      .label {
        width: 29mm;
        height: 90mm;
        border: none;
        border-radius: 0;
        padding: 2mm 1.5mm;
        page-break-after: always;
        break-after: page;
        margin: 0;
      }

      .label:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }

      @page {
        size: 29mm 90mm;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="labels-topbar">
    <span class="labels-logo"><span class="g">GAINZ</span><span class="t">TRAIN</span></span>
    <span class="sub">Print Labels</span>
  </div>

  <div class="screen-header">
    <h1>Label Preview</h1>
    <p id="label-summary">Loading orders...</p>
    <div class="btn-row" style="align-items:center;">
      <button class="btn-primary" onclick="window.print()">🖨 Print All Labels</button>
      <button class="btn-secondary" onclick="window.location.href='./'">← Back to Orders</button>
      <label style="font-size:0.85rem;font-weight:600;color:#3f3f46;display:flex;align-items:center;gap:8px;">
        Prepped on:
        <input type="date" id="prep-date"
          style="padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;font-size:0.9rem;background:#fafafa;" />
      </label>
    </div>
  </div>

  <div class="label-grid" id="label-grid"></div>

  <script>
    // ── WEEK STRING (shared with index.html via localStorage) ──
    function getWeekStr() {
      let w = localStorage.getItem("gainztrain_week");
      if (!w) {
        const today = new Date();
        const daysUntilSunday = (7 - today.getDay()) % 7 || 7;
        const sunday = new Date(today);
        sunday.setDate(today.getDate() + daysUntilSunday);
        w = `${sunday.getFullYear()}${String(sunday.getMonth()+1).padStart(2,"0")}${String(sunday.getDate()).padStart(2,"0")}`;
        localStorage.setItem("gainztrain_week", w);
      }
      return w;
    }

    // ── NORMALIZE MEAL IDs ──
    // Any meal missing meal_ids gets them generated and saved to localStorage.
    // Safe to call multiple times — skips meals that already have correct IDs.
    // DETERMINISTIC meal IDs — MUST match app/ops/prep/index.html idsForMeal() exactly so a label printed
    // here scans in the Assembly tab (even on a different device). Pure function of week+customer+meal+i.
    function mealSlug(name) {
      return String(name || "meal").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "meal";
    }
    function normalizeMealIds(orders) {
      const weekStr = getWeekStr();
      let changed = false;
      orders.forEach(order => {
        order.meals.forEach(meal => {
          const slug = mealSlug(meal.meal_name);
          const ids = [];
          for (let i = 0; i < meal.quantity; i++) ids.push(`GT-${weekStr}-${order.customer_id}-${slug}-${i + 1}`);
          if (JSON.stringify(ids) !== JSON.stringify(meal.meal_ids || [])) { meal.meal_ids = ids; changed = true; }
        });
      });
      if (changed) localStorage.setItem("gainztrain_orders", JSON.stringify(orders));
      return orders;
    }

    // ── PLACEHOLDER MACRO TABLE ──
    // ⚠️ PLACEHOLDER: These values need to be confirmed with Brycen before go-live.
    // See go-live checklist in project memory.
    const MACROS = {
      "F": {
        "Cut":      { protein: 115, carbs: 100, veggies: 60 },
        "Maintain": { protein: 115, carbs: 100, veggies: 60 },
        "Bulk":     { protein: 115, carbs: 100, veggies: 60 }
      },
      "M": {
        "Cut":      { protein: 170, carbs: 140, veggies: 100 },
        "Maintain": { protein: 170, carbs: 140, veggies: 100 },
        "Bulk":     { protein: 170, carbs: 140, veggies: 100 }
      }
    };

    // ── BUILD FLAT LIST OF INDIVIDUAL MEAL LABELS ──
    // Reads meal IDs that were stored when the order was saved — never regenerates them.
    function buildLabels(orders, prepDateStr) {
      const labels = [];
      const preppedOn = formatPrepDate(prepDateStr);

      orders.forEach(order => {
        const macros = (MACROS[order.gender] || {})[order.goal] || { protein: "?", carbs: "?", veggies: "?" };
        const firstName = order.first_name || "";
        const lastInitial = order.last_name ? order.last_name[0] + "." : "";
        const totalMeals = order.meals.reduce((sum, m) => sum + m.quantity, 0);

        order.meals.forEach(meal => {
          const ids = meal.meal_ids || [];
          for (let i = 0; i < meal.quantity; i++) {
            labels.push({
              mealId: ids[i] || "ID-MISSING",
              name: `${firstName} ${lastInitial}`,
              mealName: meal.meal_name,
              macros,
              fulfillment: order.fulfillment,
              preppedOn
            });
          }
        });
      });

      return labels;
    }

    // ── FORMAT DATE FOR DISPLAY ──
    // Turns "2026-03-29" into "Sun Mar 29, 2026"
    function formatPrepDate(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split("-").map(Number);
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    // ── GET UPCOMING SUNDAY ──
    function upcomingSunday() {
      const today = new Date();
      const daysUntilSunday = (7 - today.getDay()) % 7 || 7;
      const sunday = new Date(today);
      sunday.setDate(today.getDate() + daysUntilSunday);
      // Use local date parts — toISOString() uses UTC and can shift the date
      const year = sunday.getFullYear();
      const month = String(sunday.getMonth() + 1).padStart(2, "0");
      const day = String(sunday.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // ── RENDER ONE LABEL ──
    function renderLabel(label, idx) {
      const div = document.createElement("div");
      div.className = "label";

      div.innerHTML = `
        <div style="width:100%">
          <div class="label-name">${label.name}</div>
          <div class="label-meal">${label.mealName}</div>
        </div>

        <div class="label-macros">
          <div class="macro-chip"><span class="macro-label">P</span><span class="macro-value">${label.macros.protein}</span><span class="macro-unit">g</span></div>
          <div class="macro-chip"><span class="macro-label">C</span><span class="macro-value">${label.macros.carbs}</span><span class="macro-unit">g</span></div>
          <div class="macro-chip"><span class="macro-label">V</span><span class="macro-value">${label.macros.veggies}</span><span class="macro-unit">g</span></div>
        </div>

        <div class="label-barcode">
          <div id="qr-${idx}" class="label-qr"></div>
          <div class="meal-id-text">${label.mealId}</div>
          <div class="label-prepped">Prepped ${label.preppedOn}</div>
        </div>
      `;

      return div;
    }

    // ── MAIN: LOAD ORDERS + BUILD PAGE ──
    function renderAll() {
      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem("gainztrain_orders") || "[]");
      } catch { orders = []; }

      const grid = document.getElementById("label-grid");
      const summary = document.getElementById("label-summary");
      const prepDateStr = document.getElementById("prep-date").value;

      grid.innerHTML = "";

      if (orders.length === 0) {
        summary.textContent = "No orders found. Go back and add orders first.";
        grid.innerHTML = '<div class="empty-state">No orders in localStorage. Go back to the order entry screen and add some orders first.</div>';
        return;
      }

      normalizeMealIds(orders);
      const labels = buildLabels(orders, prepDateStr);
      const totalMeals = labels.length;
      summary.textContent = `${orders.length} customer${orders.length !== 1 ? "s" : ""} · ${totalMeals} label${totalMeals !== 1 ? "s" : ""} to print`;

      labels.forEach((label, idx) => {
        const el = renderLabel(label, idx);
        grid.appendChild(el);

        // Generate the QR after the element is in the DOM. Wrapped so one bad QR can't throw out of the
        // forEach and halt the whole sheet. Encodes just the mealId — the Assembly tab decodes it and
        // looks the meal up locally (a customer scanning it gets a meaningless string, nothing actionable).
        try {
          new QRCode(document.getElementById(`qr-${idx}`), {
            text: label.mealId,
            width: 96,
            height: 96,
            correctLevel: QRCode.CorrectLevel.M
          });
        } catch (e) { /* keep rendering the rest of the labels */ }
      });
    }

    // Set date picker default to upcoming Sunday, then render
    const dateInput = document.getElementById("prep-date");
    dateInput.value = upcomingSunday();
    dateInput.addEventListener("change", renderAll);

    renderAll();
  </script>
</body>
</html>
