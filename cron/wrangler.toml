# Standalone scheduled Worker for the Gainz Train weekly cycle (separate from the Pages project).
name = "gainztrain-cron"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
# Wed 16:00 — publish menu. Wed 17:00 — reminders. Fri 22:00 — last call. Sat 06:30 — lock.
# Daily 13:00 — owner digest + health probe (also prunes the feed on Mondays). Max 5 cron triggers/account.
crons = ["0 16 * * 3", "0 17 * * 3", "0 22 * * 5", "30 6 * * 6", "0 13 * * *"]
