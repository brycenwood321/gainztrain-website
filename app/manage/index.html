<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Plan | Gainz Train</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--black:#1a1614;--surface:#fff;--mid:#f5f2ee;--bg:#fafaf8;--gray:#4a4440;--muted:#7a7270;
      --line:#ede9e3;--orange:#ff6b35;--orange-dark:#cc5520;--green:#16a34a;--red:#dc2626;
      --head:'Barlow Condensed',sans-serif;--body:'Inter',sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--body);background:var(--bg);color:var(--black);line-height:1.5;-webkit-font-smoothing:antialiased;}
    h1,h2{font-family:var(--head);font-weight:700;line-height:1.05;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line);background:var(--surface);}
    .brand{font-family:var(--head);font-weight:700;font-size:1.3rem;}.brand .t{color:var(--orange);}
    .topbar a{color:var(--gray);text-decoration:none;font-size:.9rem;font-weight:600;}
    .wrap{max-width:560px;margin:0 auto;padding:1.25rem 1.25rem 4rem;}
    h1{font-size:2rem;margin-bottom:1rem;}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1rem;box-shadow:0 4px 18px rgba(0,0,0,.03);}
    .card h2{font-size:1.25rem;margin-bottom:.2rem;}
    .card .sub{color:var(--muted);font-size:.88rem;margin-bottom:1rem;}
    .badge{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.78rem;font-weight:600;text-transform:capitalize;}
    .badge.active,.badge.trialing{background:#f0fdf4;color:var(--green);}.badge.paused{background:#fffbeb;color:#b45309;}
    .badge.canceled,.badge.past_due{background:#fef2f2;color:var(--red);}
    .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line);}
    .row:last-child{border-bottom:none;}
    label{display:block;font-size:.82rem;font-weight:600;color:var(--gray);margin:.7rem 0 .35rem;}
    input,select{width:100%;font-family:var(--body);font-size:1rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:9px;background:var(--bg);}
    input:focus,select:focus{outline:none;border-color:var(--orange);background:#fff;}
    .row2{display:grid;grid-template-columns:2fr 1fr;gap:.5rem;}
    .btn{font-family:var(--body);font-weight:600;font-size:.92rem;border:none;border-radius:9px;padding:.65rem 1.1rem;cursor:pointer;background:var(--orange);color:#fff;}
    .btn:hover:not(:disabled){background:var(--orange-dark);}.btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn.ghost{background:transparent;color:var(--gray);border:1px solid var(--line);}
    .btn.ghost:hover{background:var(--mid);}
    .btn.danger{background:transparent;color:var(--red);border:1px solid #fecaca;}
    .btn.danger:hover{background:#fef2f2;}
    .stepper{display:flex;align-items:center;gap:.8rem;}
    .stepbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.2rem;font-weight:700;color:var(--orange);cursor:pointer;}
    .stepbtn:disabled{opacity:.35;}
    .qn{font-family:var(--head);font-weight:700;font-size:1.4rem;min-width:1.4rem;text-align:center;}
    .toggle{display:flex;gap:.5rem;margin-bottom:.3rem;}
    .opt{flex:1;text-align:center;border:2px solid var(--line);border-radius:9px;padding:.55rem;font-weight:600;color:var(--gray);cursor:pointer;font-size:.9rem;}
    .opt.sel{border-color:var(--orange);color:var(--black);background:#fff;}
    .msg{padding:.7rem .9rem;border-radius:9px;font-size:.88rem;margin-bottom:1rem;display:none;}
    .msg.show{display:block;}.msg.ok{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}
    .msg.err{background:#fef2f2;color:var(--red);border:1px solid #fecaca;}
    .empty{text-align:center;padding:3rem 1rem;color:var(--muted);}.empty a{color:var(--orange-dark);font-weight:600;}
    .loading{text-align:center;padding:4rem;color:var(--muted);}
    .hidden{display:none!important;}
    .acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;}
  </style>
</head>
<body>
  <div class="topbar"><div class="brand">GAINZ<span class="t">TRAIN</span></div><a href="/app/">← My account</a></div>
  <div class="wrap">
    <div id="loading" class="loading">Loading…</div>
    <div id="msg" class="msg"></div>
    <div id="empty" class="empty hidden"></div>
    <div id="app" class="hidden">
      <h1>Manage your plan</h1>

      <div class="card" id="planCard">
        <h2>Your plan</h2>
        <div class="sub" id="planSub"></div>
        <div class="row"><span>Meals per week</span>
          <div class="stepper"><button class="stepbtn" id="tMinus">–</button><span class="qn" id="tMeals">0</span><button class="stepbtn" id="tPlus">+</button></div>
        </div>
        <div class="acts">
          <button class="btn" id="tSave" disabled>Save meal count</button>
          <button class="btn ghost" id="pauseBtn">Pause</button>
          <button class="btn ghost" id="resumeBtn">Resume</button>
          <button class="btn ghost" id="cardBtn">Update card</button>
          <button class="btn danger" id="cancelBtn">Cancel plan</button>
        </div>
      </div>

      <div class="card">
        <h2>Goal &amp; body</h2>
        <div class="sub">Sets your meal portions and macros. Doesn't change your price.</div>
        <label>Goal</label>
        <select id="goal"><option value="">—</option><option value="cut">Cut (lose fat)</option><option value="maintain">Maintain</option><option value="build">Build (gain muscle)</option></select>
        <label>Sex</label>
        <select id="sex"><option value="">—</option><option value="male">Male</option><option value="female">Female</option></select>
        <div class="acts"><button class="btn" id="goalSave">Save goal</button></div>
      </div>

      <div class="card">
        <h2>Delivery</h2>
        <div class="sub">Pickup is free at our Orem kitchen. Delivery fee depends on your area.</div>
        <div class="toggle"><div class="opt" id="optPickup">Pickup</div><div class="opt" id="optDelivery">Delivery</div></div>
        <div id="addrFields" class="hidden">
          <label>Street address</label><input id="address" type="text" autocomplete="street-address" />
          <div class="row2"><div><label>City</label><input id="city" type="text" /></div><div><label>Zip</label><input id="zip" type="text" inputmode="numeric" maxlength="5" /></div></div>
        </div>
        <div class="acts"><button class="btn" id="addrSave">Save delivery</button></div>
      </div>
    </div>
  </div>

  <script>
    const $=id=>document.getElementById(id);
    const api=(p,o={})=>fetch(p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o}).then(async r=>({status:r.status,body:await r.json().catch(()=>({}))}));
    const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
    function msg(t,k){const m=$('msg');m.textContent=t;m.className='msg show '+k;window.scrollTo(0,0);}
    let ME=null,sub=null,tier=9,method='pickup';

    async function load(){
      const r=await api('/api/me');
      $('loading').classList.add('hidden');
      if(r.status!==200||!r.body.ok){location.href='/app/';return;}
      ME=r.body;sub=ME.subscription;
      const dead=['canceled','incomplete_expired','incomplete'];
      if(!sub||dead.includes(sub.status)){
        $('empty').classList.remove('hidden');
        $('empty').innerHTML=(sub?`Your plan is ${(sub.status||'').replace('_',' ')}.`:'You don\'t have an active plan.')+' <a href="/start/">Start a plan →</a>';
        return;
      }
      $('app').classList.remove('hidden');
      const st=sub.status||'';
      $('planSub').innerHTML=`<span class="badge ${st}">${st.replace('_',' ')}</span> · ${sub.meals_per_week} meals/week`+(sub.cancel_at_period_end?' · <b>cancels at period end</b>':'');
      tier=Math.min(16,Math.max(6,sub.meals_per_week||9));$('tMeals').textContent=tier;
      $('pauseBtn').classList.toggle('hidden',st==='paused');
      $('resumeBtn').classList.toggle('hidden',st!=='paused');
      $('cancelBtn').textContent=sub.cancel_at_period_end?'Undo cancellation':'Cancel plan';
      $('goal').value=ME.customer.goal||'';$('sex').value=ME.customer.sex||'';
      method=ME.customer.delivery_method||'pickup';setMethod(method);
      $('address').value=ME.customer.address||'';$('city').value=ME.customer.city||'';$('zip').value=ME.customer.zip||'';
    }
    function setMethod(m){method=m;$('optPickup').classList.toggle('sel',m==='pickup');$('optDelivery').classList.toggle('sel',m==='delivery');$('addrFields').classList.toggle('hidden',m!=='delivery');}
    $('optPickup').onclick=()=>setMethod('pickup');$('optDelivery').onclick=()=>setMethod('delivery');

    // meal count
    $('tMinus').onclick=()=>{if(tier>6){tier--;$('tMeals').textContent=tier;$('tSave').disabled=(tier===sub.meals_per_week);}};
    $('tPlus').onclick=()=>{if(tier<16){tier++;$('tMeals').textContent=tier;$('tSave').disabled=(tier===sub.meals_per_week);}};
    async function act(btn,fn){const b=$(btn);const old=b.textContent;b.disabled=true;b.textContent='…';const r=await fn();b.disabled=false;b.textContent=old;
      if(r.status===200&&r.body.ok!==false){msg('Saved.','ok');await load();}else{msg(r.body.detail||'Could not save. Try again.','err');}}
    $('tSave').onclick=()=>act('tSave',()=>post('/api/account/tier',{meals:tier}));
    $('pauseBtn').onclick=()=>act('pauseBtn',()=>post('/api/account/pause'));
    $('resumeBtn').onclick=()=>act('resumeBtn',()=>post('/api/account/resume'));
    $('cancelBtn').onclick=()=>act('cancelBtn',()=>post('/api/account/cancel',{undo:!!(sub&&sub.cancel_at_period_end)}));
    $('goalSave').onclick=()=>act('goalSave',()=>post('/api/account/goal',{goal:$('goal').value,sex:$('sex').value}));
    $('addrSave').onclick=()=>act('addrSave',()=>post('/api/account/address',{delivery_method:method,address:$('address').value,city:$('city').value,zip:$('zip').value}));
    $('cardBtn').onclick=async()=>{const b=$('cardBtn');b.disabled=true;b.textContent='…';const r=await post('/api/account/portal');if(r.body.url){location.href=r.body.url;return;}b.disabled=false;b.textContent='Update card';msg(r.body.detail||'Could not open billing.','err');};

    load();
  </script>
</body>
</html>
