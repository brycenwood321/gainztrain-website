<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GainzTrain — Print Labels</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- qrcode.js: generates QR codes in the browser (no internet). QR so an iPhone camera can scan the
       label in the Assembly tab — 1D barcodes need a scanner gun; QR works with any phone camera. -->
  <script src="lib/qrcode.min.js"></script>

  <style>
    /* ── SCREEN STYLES (what you see before printing) ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf8;
      padding: 0 0 40px;
      color: #1a1614;
    }

    /* Dashboard-style dark header bar with the GAINZTRAIN wordmark + orange accent. */
    .labels-topbar {
      background: #1a1614; border-bottom: 3px solid #ff6b35;
      padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .labels-logo { font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 1.35rem; letter-spacing: .08em; text-transform: uppercase; line-height: 1; }
    .labels-logo .g { color: #fff; } .labels-logo .t { color: #ff6b35; }
    .labels-topbar .sub { color: #9a908c; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; }

    .screen-header {
      max-width: 900px;
      margin: 22px auto 20px;
      padding: 0 24px;
    }

    .screen-header h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
      margin-bottom: 4px;
    }

    .screen-header p {
      color: #7a7270;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: #ff6b35; color: #fff; }
    .btn-secondary { background: #f0ebe5; color: #3f3f46; border: 1px solid #e2dad0; }

    .label-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      color: #a1a1aa;
      padding: 60px 0;
      font-size: 0.95rem;
      width: 100%;
    }

    /* ── LABEL STYLES ── LANDSCAPE meal tag on the Brother DK-1201 (physical die-cut 29mm × 90mm).
       On screen we show it landscape (90mm × 29mm) so it's readable; in @media print it's rotated 90°
       to fit the physical label. Layout: QR on the LEFT, then Name / Meal / P C V line to the right. */
    .label {
      width: 340px;    /* 90mm landscape at 96dpi */
      height: 110px;   /* 29mm */
      background: #fff;
      border: 1.5px solid #d4d4d8;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif; /* prints cleanly on thermal */
    }

    .label-rot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 3mm;
      padding: 2mm 2.5mm;
      box-sizing: border-box;
    }

    /* QR on the left, fixed square (quiet-zone from the white label). */
    .lbl-qr { flex: 0 0 auto; background: #fff; line-height: 0; }
    .lbl-qr canvas,
    .lbl-qr img { display: block; width: 25mm !important; height: 25mm !important; }

    /* Text column to the right: name, meal, macros line (descending). */
    .lbl-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .lbl-name { font-size: 15px; font-weight: 900; line-height: 1.05; color: #000; }
    .lbl-meal { font-size: 10px; font-weight: 600; color: #333; line-height: 1.15; margin-top: 1mm; }
    .lbl-macros { display: flex; gap: 3.5mm; font-size: 11px; font-weight: 700; color: #000; margin-top: 1.5mm; }
    .lbl-macros b { font-weight: 900; }
    /* Let the full GT code + date wrap onto the lines beneath instead of getting cut off. */
    .lbl-id { font-size: 7px; color: #b3b3b3; font-family: monospace; margin-top: 1mm; line-height: 1.25; word-break: break-all; }

    /* ── PRINT STYLES ── */
    @media print {
      /* Lock the whole print surface to ONE label width. iOS Safari lays the page out at its content
         width then scales it to the paper — any element wider than 29mm (e.g. the header bar) shrinks
         every label to a tiny sliver. Constraining html/body/grid to 29mm makes it print 1:1. */
      html, body {
        width: 29mm;
        background: #fff;
        padding: 0;
        margin: 0;
      }

      /* Hide EVERYTHING that isn't a label so nothing forces the page wide. */
      .labels-topbar, .screen-header { display: none !important; }

      .label-grid {
        display: block;
        width: 29mm;
        max-width: 29mm;
        margin: 0;
        padding: 0;
        gap: 0;
      }

      /*
        One physical Brother DK-1201 label per page (29mm × 90mm). The content is authored landscape
        (90mm × 29mm) and rotated 90° to fit. In the print dialog pick the DK-1201 label size, margins
        None, scale 100%, headers/footers OFF.
      */
      .label {
        width: 29mm;
        height: 90mm;
        border: none;
        border-radius: 0;
        padding: 0;
        page-break-after: always;
        break-after: page;
        margin: 0;
      }

      /* Rotate the landscape content 90° and center it in the 29×90mm page. */
      .label-rot {
        inset: auto;
        top: 50%;
        left: 50%;
        width: 90mm;
        height: 29mm;
        transform: translate(-50%, -50%) rotate(90deg);
        padding: 2mm 2.5mm;
      }

      .label:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }

      /* ── DK-2251 62mm CONTINUOUS tape mode (toggled via "Label stock") ──
         TWO labels side by side across the 62mm tape width. Each label is portrait: QR on TOP, the
         words BELOW it. Pairs flow DOWN the tape; a faint dashed line marks the cut between the two.
         No 90° rotation — the content sits upright in each 31mm-wide half of the tape. */
      html.tape62, html.tape62 body { width: 62mm; }
      html.tape62 .label-grid { width: 62mm; max-width: 62mm; margin: 0; padding: 0; display: block; }
      html.tape62 .label-pair {
        display: flex;
        width: 62mm;
        page-break-after: always;
        break-after: page;
      }
      html.tape62 .label-pair:last-child { page-break-after: avoid; break-after: avoid; }
      html.tape62 .label {
        width: 31mm; height: 46mm;
        page-break-after: auto; break-after: auto;
      }
      html.tape62 .label-pair .label:first-child { border-right: 0.3mm dashed #cccccc; } /* cut guide */
      html.tape62 .label-rot {
        inset: 0; top: auto; left: auto;
        width: 31mm; height: 46mm;
        transform: none;
        flex-direction: column;
        align-items: center; justify-content: flex-start;
        gap: 1mm; padding: 2mm 1.5mm;
        text-align: center;
      }
      html.tape62 .lbl-qr img, html.tape62 .lbl-qr canvas { width: 22mm !important; height: 22mm !important; }
      html.tape62 .lbl-info { align-items: center; text-align: center; min-width: 0; }
      html.tape62 .lbl-macros { justify-content: center; gap: 2.5mm; }
      html.tape62 .lbl-id { text-align: center; }

      @page {
        size: 29mm 90mm;
        margin: 0;
      }
    }
  </style>
  <!-- JS sets the @page size here to match the chosen label stock (later @page wins the cascade). -->
  <style id="pageSize">@media print { @page { size: 29mm 90mm; margin: 0; } }</style>
</head>
<body>

  <div class="labels-topbar">
    <span class="labels-logo"><span class="g">GAINZ</span><span class="t">TRAIN</span></span>
    <span class="sub">Print Labels</span>
  </div>

  <div class="screen-header">
    <h1>Label Preview</h1>
    <p id="label-summary">Loading orders...</p>
    <div class="btn-row" style="align-items:center;">
      <button class="btn-primary" onclick="window.print()">🖨 Print All Labels</button>
      <button class="btn-secondary" onclick="window.location.href='./'">← Back to Orders</button>
      <label style="font-size:0.85rem;font-weight:600;color:#3f3f46;display:flex;align-items:center;gap:8px;">
        Prepped on:
        <input type="date" id="prep-date"
          style="padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;font-size:0.9rem;background:#fafafa;" />
      </label>
      <label style="font-size:0.85rem;font-weight:600;color:#3f3f46;display:flex;align-items:center;gap:8px;">
        Label stock:
        <select id="label-stock" onchange="applyStock(this.value)"
          style="padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;font-size:0.9rem;background:#fafafa;">
          <option value="29">DK-1201 · 29mm die-cut</option>
          <option value="62">DK-2251 · 62mm continuous</option>
        </select>
      </label>
    </div>
  </div>

  <div class="label-grid" id="label-grid"></div>

  <script>
    // ── WEEK STRING (shared with index.html via localStorage) ──
    function getWeekStr() {
      let w = localStorage.getItem("gainztrain_week");
      if (!w) {
        const today = new Date();
        // On Sunday, stay on today's delivery week (no `|| 7`) so labels match the dashboard's meal IDs.
        const daysUntilSunday = (7 - today.getDay()) % 7;
        const sunday = new Date(today);
        sunday.setDate(today.getDate() + daysUntilSunday);
        w = `${sunday.getFullYear()}${String(sunday.getMonth()+1).padStart(2,"0")}${String(sunday.getDate()).padStart(2,"0")}`;
        localStorage.setItem("gainztrain_week", w);
      }
      return w;
    }

    // ── NORMALIZE MEAL IDs ──
    // Any meal missing meal_ids gets them generated and saved to localStorage.
    // Safe to call multiple times — skips meals that already have correct IDs.
    // DETERMINISTIC meal IDs — MUST match app/ops/prep/index.html idsForMeal() exactly so a label printed
    // here scans in the Assembly tab (even on a different device). Pure function of week+customer+meal+i.
    function mealSlug(name) {
      return String(name || "meal").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "meal";
    }
    function normalizeMealIds(orders) {
      const weekStr = getWeekStr();
      let changed = false;
      orders.forEach(order => {
        order.meals.forEach(meal => {
          const slug = mealSlug(meal.meal_name);
          const ids = [];
          for (let i = 0; i < meal.quantity; i++) ids.push(`GT-${weekStr}-${order.customer_id}-${slug}-${i + 1}`);
          if (JSON.stringify(ids) !== JSON.stringify(meal.meal_ids || [])) { meal.meal_ids = ids; changed = true; }
        });
      });
      if (changed) localStorage.setItem("gainztrain_orders", JSON.stringify(orders));
      return orders;
    }

    // ── MACRO PORTION TARGETS (CONFIRMED 2026-07-14) ──
    // Portion sizes are set by GENDER only; goal (Cut/Maintain/Bulk) does not change them.
    // Female: 115P / 100C / 60V · Male: 170P / 140C / 100V.
    const MACROS = {
      "F": {
        "Cut":      { protein: 115, carbs: 100, veggies: 60 },
        "Maintain": { protein: 115, carbs: 100, veggies: 60 },
        "Bulk":     { protein: 115, carbs: 100, veggies: 60 }
      },
      "M": {
        "Cut":      { protein: 170, carbs: 140, veggies: 100 },
        "Maintain": { protein: 170, carbs: 140, veggies: 100 },
        "Bulk":     { protein: 170, carbs: 140, veggies: 100 }
      }
    };

    // ── BUILD FLAT LIST OF INDIVIDUAL MEAL LABELS ──
    // Reads meal IDs that were stored when the order was saved — never regenerates them.
    function buildLabels(orders, prepDateStr) {
      const labels = [];
      const preppedOn = formatPrepDate(prepDateStr);

      orders.forEach(order => {
        const macros = (MACROS[order.gender] || {})[order.goal] || { protein: "?", carbs: "?", veggies: "?" };
        const firstName = order.first_name || "";
        const lastInitial = order.last_name ? order.last_name[0] + "." : "";
        const totalMeals = order.meals.reduce((sum, m) => sum + m.quantity, 0);

        order.meals.forEach(meal => {
          const ids = meal.meal_ids || [];
          for (let i = 0; i < meal.quantity; i++) {
            labels.push({
              mealId: ids[i] || "ID-MISSING",
              name: `${firstName} ${lastInitial}`,
              mealName: meal.meal_name,
              macros,
              fulfillment: order.fulfillment,
              preppedOn
            });
          }
        });
      });

      return labels;
    }

    // ── FORMAT DATE FOR DISPLAY ──
    // Turns "2026-03-29" into "Sun Mar 29, 2026"
    function formatPrepDate(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split("-").map(Number);
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    // ── GET UPCOMING SUNDAY ──
    function upcomingSunday() {
      const today = new Date();
      const daysUntilSunday = (7 - today.getDay()) % 7;  // Sunday → today (matches the dashboard week)
      const sunday = new Date(today);
      sunday.setDate(today.getDate() + daysUntilSunday);
      // Use local date parts — toISOString() uses UTC and can shift the date
      const year = sunday.getFullYear();
      const month = String(sunday.getMonth() + 1).padStart(2, "0");
      const day = String(sunday.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // ── RENDER ONE LABEL ──
    function renderLabel(label, idx) {
      const div = document.createElement("div");
      div.className = "label";

      div.innerHTML = `
        <div class="label-rot">
          <div class="lbl-qr" id="qr-${idx}"></div>
          <div class="lbl-info">
            <div class="lbl-name">${label.name}</div>
            <div class="lbl-meal">${label.mealName}</div>
            <div class="lbl-macros">
              <span>P <b>${label.macros.protein}</b>g</span>
              <span>C <b>${label.macros.carbs}</b>g</span>
              <span>V <b>${label.macros.veggies}</b>g</span>
            </div>
            <div class="lbl-id">${label.mealId} · ${label.preppedOn}</div>
          </div>
        </div>
      `;

      return div;
    }

    // ── MAIN: LOAD ORDERS + BUILD PAGE ──
    function renderAll() {
      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem("gainztrain_orders") || "[]");
      } catch { orders = []; }

      const grid = document.getElementById("label-grid");
      const summary = document.getElementById("label-summary");
      const prepDateStr = document.getElementById("prep-date").value;

      grid.innerHTML = "";

      if (orders.length === 0) {
        summary.textContent = "No orders found. Go back and add orders first.";
        grid.innerHTML = '<div class="empty-state">No orders in localStorage. Go back to the order entry screen and add some orders first.</div>';
        return;
      }

      normalizeMealIds(orders);
      const labels = buildLabels(orders, prepDateStr);
      const totalMeals = labels.length;
      summary.textContent = `${orders.length} customer${orders.length !== 1 ? "s" : ""} · ${totalMeals} label${totalMeals !== 1 ? "s" : ""} to print`;

      const twoUp = document.documentElement.classList.contains("tape62");  // DK-2251 = 2 labels per row
      let pair = null;
      labels.forEach((label, idx) => {
        const el = renderLabel(label, idx);
        if (twoUp) {
          if (idx % 2 === 0) { pair = document.createElement("div"); pair.className = "label-pair"; grid.appendChild(pair); }
          pair.appendChild(el);
        } else {
          grid.appendChild(el);
        }

        // Generate the QR after the element is in the DOM. Wrapped so one bad QR can't throw out of the
        // forEach and halt the whole sheet. Encodes just the mealId — the Assembly tab decodes it and
        // looks the meal up locally (a customer scanning it gets a meaningless string, nothing actionable).
        try {
          new QRCode(document.getElementById(`qr-${idx}`), {
            text: label.mealId,
            width: 150,
            height: 150,
            correctLevel: QRCode.CorrectLevel.M
          });
        } catch (e) { /* keep rendering the rest of the labels */ }
      });
    }

    // ── LABEL STOCK: DK-1201 (29mm die-cut, default) vs DK-2251 (62mm continuous tape) ──
    // Switches the print layout + @page size. Choice is remembered per device. ?tape=62 also selects it.
    function applyStock(stock) {
      const is62 = String(stock) === "62";
      document.documentElement.classList.toggle("tape62", is62);
      // @page = ONE printed segment. 62mm mode = a PAIR of labels side by side (62mm wide × 46mm down).
      document.getElementById("pageSize").textContent = is62
        ? "@media print { @page { size: 62mm 46mm; margin: 0; } }"
        : "@media print { @page { size: 29mm 90mm; margin: 0; } }";
      const sel = document.getElementById("label-stock");
      if (sel) sel.value = is62 ? "62" : "29";
      localStorage.setItem("gt_label_stock", is62 ? "62" : "29");
      // Re-render so the DOM regroups into pairs (62mm) or flat labels (29mm).
      if (typeof renderAll === "function") renderAll();
    }

    // Set date picker default to upcoming Sunday, then render
    const dateInput = document.getElementById("prep-date");
    dateInput.value = upcomingSunday();
    dateInput.addEventListener("change", renderAll);

    // Restore saved label stock (or ?tape=62), default die-cut.
    const _tapeParam = new URLSearchParams(location.search).get("tape");
    applyStock(_tapeParam === "62" ? "62" : (localStorage.getItem("gt_label_stock") || "29"));

    renderAll();
  </script>
</body>
</html>
