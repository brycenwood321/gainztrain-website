<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GainzTrain — Print Labels</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- qrcode.js: generates QR codes in the browser (no internet). QR so an iPhone camera can scan the
       label in the Assembly tab — 1D barcodes need a scanner gun; QR works with any phone camera. -->
  <script src="lib/qrcode.min.js"></script>

  <style>
    /* ── SCREEN STYLES (what you see before printing) ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf8;
      padding: 0 0 40px;
      color: #1a1614;
    }

    /* Dashboard-style dark header bar with the GAINZTRAIN wordmark + orange accent. */
    .labels-topbar {
      background: #1a1614; border-bottom: 3px solid #ff6b35;
      padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .labels-logo { font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 1.35rem; letter-spacing: .08em; text-transform: uppercase; line-height: 1; }
    .labels-logo .g { color: #fff; } .labels-logo .t { color: #ff6b35; }
    .labels-topbar .sub { color: #9a908c; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; }

    .screen-header {
      max-width: 900px;
      margin: 22px auto 20px;
      padding: 0 24px;
    }

    .screen-header h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
      margin-bottom: 4px;
    }

    .screen-header p {
      color: #7a7270;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: #ff6b35; color: #fff; }
    .btn-secondary { background: #f0ebe5; color: #3f3f46; border: 1px solid #e2dad0; }

    .label-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      color: #a1a1aa;
      padding: 60px 0;
      font-size: 0.95rem;
      width: 100%;
    }

    /* ── LABEL STYLES ── ONE PACKING SLIP PER CLIENT on Brother DK-2251 (62mm CONTINUOUS tape).
       No rotation: the tape feeds 62mm across the head and we choose the length, which is what makes
       a variable-length list the right fit here. Length is set at print time from the client with the
       most lines (see renderAll), so a 3 line label and a 6 line label are never clipped. */
    .label {
      width: 235px;              /* 62mm at 96dpi, for the on-screen preview */
      background: #fff;
      border: 1.5px solid #d4d4d8;
      border-radius: 4px;
      padding: 3mm;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;   /* prints cleanly on thermal */
      color: #000;
    }
    .lbl-head { border-bottom: 0.5mm solid #000; padding-bottom: 1.5mm; margin-bottom: 2mm; }
    .lbl-name { font-size: 15px; font-weight: 900; text-transform: uppercase; line-height: 1.05; word-break: break-word; }
    .lbl-meta { font-size: 10px; font-weight: 800; letter-spacing: .04em; margin-top: 1mm; }
    .lbl-date { font-size: 10px; font-weight: 700; letter-spacing: .03em; margin-top: 0.6mm; }

    .lbl-lines { display: flex; flex-direction: column; gap: 1.4mm; }
    .lbl-line { display: flex; align-items: flex-start; gap: 2mm; }
    /* Big enough to tick with a pen, in gloves, without clipping the neighbouring line. */
    .lbl-box { flex: 0 0 auto; width: 4.2mm; height: 4.2mm; border: 0.45mm solid #000; border-radius: 0.6mm; margin-top: 0.3mm; }
    .lbl-qty { flex: 0 0 auto; min-width: 4mm; font-size: 12px; font-weight: 900; line-height: 1.2; }
    .lbl-meal { flex: 1; font-size: 11px; font-weight: 700; line-height: 1.2; text-transform: uppercase; word-break: break-word; }
    .lbl-size { font-size: 9px; font-weight: 600; white-space: nowrap; }

    /* ── PRINT STYLES ──
       Lock the print surface to ONE label width. iOS Safari lays the page out at its content width
       then scales it to the paper, so anything wider than 62mm shrinks every label to a sliver.
       In the print dialog pick the DK-2251 62mm stock, margins None, scale 100%, headers/footers OFF.
       Print from CHROME, not Safari. */
    @media print {
      html, body { width: 62mm; background: #fff; padding: 0; margin: 0; }
      .labels-topbar, .screen-header { display: none !important; }
      .label-grid { display: block; width: 62mm; max-width: 62mm; margin: 0; padding: 0; gap: 0; }
      .label {
        width: 62mm;
        border: none;
        border-radius: 0;
        page-break-after: always;
        break-after: page;
        margin: 0;
        overflow: hidden;
      }
      .label:last-child { page-break-after: avoid; break-after: avoid; }
      @page { size: 62mm 65mm; margin: 0; }
    }
  </style>
  <!-- Set at print time from the longest label, so the tape length always fits. -->
  <style id="pageSize">@media print { @page { size: 62mm 65mm; margin: 0; } }</style>
</head>
<body>

  <div class="labels-topbar">
    <span class="labels-logo"><span class="g">GAINZ</span><span class="t">TRAIN</span></span>
    <span class="sub">Print Labels</span>
  </div>

  <div class="screen-header">
    <h1>Label Preview</h1>
    <p id="label-summary">Loading orders...</p>
    <div class="btn-row" style="align-items:center;">
      <button class="btn-primary" onclick="window.print()">🖨 Print All Labels</button>
      <button class="btn-secondary" onclick="window.location.href='./'">← Back to Orders</button>
      <label style="font-size:0.85rem;font-weight:600;color:#3f3f46;display:flex;align-items:center;gap:8px;">
        Prepped on:
        <input type="date" id="prep-date"
          style="padding:8px 10px;border:1px solid #d4d4d8;border-radius:8px;font-size:0.9rem;background:#fafafa;" />
      </label>
    </div>
  </div>

  <div class="label-grid" id="label-grid"></div>

  <script>
    // ── WEEK STRING (shared with index.html via localStorage) ──
    function getWeekStr() {
      let w = localStorage.getItem("gainztrain_week");
      if (!w) {
        const today = new Date();
        // On Sunday, stay on today's delivery week (no `|| 7`) so labels match the dashboard's meal IDs.
        const daysUntilSunday = (7 - today.getDay()) % 7;
        const sunday = new Date(today);
        sunday.setDate(today.getDate() + daysUntilSunday);
        w = `${sunday.getFullYear()}${String(sunday.getMonth()+1).padStart(2,"0")}${String(sunday.getDate()).padStart(2,"0")}`;
        localStorage.setItem("gainztrain_week", w);
      }
      return w;
    }

    // ── NORMALIZE MEAL IDs ──
    // Any meal missing meal_ids gets them generated and saved to localStorage.
    // Safe to call multiple times — skips meals that already have correct IDs.
    // DETERMINISTIC meal IDs — MUST match app/ops/prep/index.html idsForMeal() exactly so a label printed
    // here scans in the Assembly tab (even on a different device). Pure function of week+customer+meal+i.
    function mealSlug(name) {
      return String(name || "meal").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "meal";
    }
    function normalizeMealIds(orders) {
      const weekStr = getWeekStr();
      let changed = false;
      orders.forEach(order => {
        order.meals.forEach(meal => {
          const slug = mealSlug(meal.meal_name);
          const ids = [];
          for (let i = 0; i < meal.quantity; i++) ids.push(`GT-${weekStr}-${order.customer_id}-${slug}-${i + 1}`);
          if (JSON.stringify(ids) !== JSON.stringify(meal.meal_ids || [])) { meal.meal_ids = ids; changed = true; }
        });
      });
      if (changed) localStorage.setItem("gainztrain_orders", JSON.stringify(orders));
      return orders;
    }

    // ── MACRO PORTION TARGETS (CONFIRMED 2026-07-14) ──
    // Portion sizes are set by GENDER only; goal (Cut/Maintain/Bulk) does not change them.
    // Female: 115P / 100C / 60V · Male: 170P / 140C / 100V.
    const MACROS = {
      "F": {
        "Cut":      { protein: 115, carbs: 100, veggies: 60 },
        "Maintain": { protein: 115, carbs: 100, veggies: 60 },
        "Bulk":     { protein: 115, carbs: 100, veggies: 60 }
      },
      "M": {
        "Cut":      { protein: 170, carbs: 140, veggies: 100 },
        "Maintain": { protein: 170, carbs: 140, veggies: 100 },
        "Bulk":     { protein: 170, carbs: 140, veggies: 100 }
      }
    };

    // ── BUILD ONE LABEL PER CLIENT (2026-08-31) ──
    // Was one label per MEAL: 262 labels for the week of Aug 30, and about an hour of the prep
    // window spent sticking them on containers. The kitchen cooks a dish in bulk and piles it, then
    // bags client by client, so the label that helps is a PACKING SLIP for one person: who it is,
    // how many meals, and a tick box per line to mark off as each goes in the bag.
    function buildLabels(orders, prepDateStr) {
      const preppedOn = formatPrepDate(prepDateStr);
      return orders.map(order => {
        const lastInitial = order.last_name ? order.last_name[0] + "." : "";
        const lines = (order.meals || [])
          .filter(m => (Number(m.quantity) || 0) > 0)
          .map(m => ({ qty: Number(m.quantity) || 0, mealName: m.meal_name }));
        return {
          name: `${order.first_name || ""} ${lastInitial}`.trim() || "Unnamed",
          preppedOn,
          totalMeals: lines.reduce((sum, l) => sum + l.qty, 0),
          // Portions are gender-only, but the kitchen reads the goal off the label, so show the same
          // default the rest of the system falls back to rather than leaving a blank.
          size: String(order.goal || "Maintain").toUpperCase(),
          fulfillment: order.fulfillment,
          lines,
        };
      }).filter(l => l.lines.length);
    }

    // ── FORMAT DATE FOR DISPLAY ──
    // Turns "2026-03-29" into "Sun Mar 29, 2026"
    function formatPrepDate(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split("-").map(Number);
      const d = new Date(year, month - 1, day);
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    // ── GET UPCOMING SUNDAY ──
    function upcomingSunday() {
      const today = new Date();
      const daysUntilSunday = (7 - today.getDay()) % 7;  // Sunday → today (matches the dashboard week)
      const sunday = new Date(today);
      sunday.setDate(today.getDate() + daysUntilSunday);
      // Use local date parts — toISOString() uses UTC and can shift the date
      const year = sunday.getFullYear();
      const month = String(sunday.getMonth() + 1).padStart(2, "0");
      const day = String(sunday.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // ── RENDER ONE CLIENT LABEL ──
    function renderLabel(label) {
      const div = document.createElement("div");
      div.className = "label";
      const esc = t => String(t == null ? "" : t)
        .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      div.innerHTML = `
        <div class="lbl-head">
          <div class="lbl-name">${esc(label.name)}</div>
          <div class="lbl-meta">${label.totalMeals} MEAL${label.totalMeals === 1 ? "" : "S"}
            &middot; ${esc(label.fulfillment === "delivery" ? "DELIVERY" : "PICKUP")}</div>
          <div class="lbl-date">PREPPED ${esc(label.preppedOn)}</div>
        </div>
        <div class="lbl-lines">
          ${label.lines.map(l => `
            <div class="lbl-line">
              <span class="lbl-box"></span>
              <span class="lbl-qty">${l.qty}</span>
              <span class="lbl-meal">${esc(l.mealName)}
                <span class="lbl-size">(${esc(label.size)})</span></span>
            </div>`).join("")}
        </div>
      `;
      return div;
    }

    // ── MAIN: LOAD ORDERS + BUILD PAGE ──
    function renderAll() {
      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem("gainztrain_orders") || "[]");
      } catch { orders = []; }

      const grid = document.getElementById("label-grid");
      const summary = document.getElementById("label-summary");
      const prepDateStr = document.getElementById("prep-date").value;

      grid.innerHTML = "";

      if (orders.length === 0) {
        summary.textContent = "No orders found. Go back and add orders first.";
        grid.innerHTML = '<div class="empty-state">No orders in localStorage. Go back to the order entry screen and add some orders first.</div>';
        return;
      }

      const labels = buildLabels(orders, prepDateStr);
      const totalMeals = labels.reduce((sum, l) => sum + l.totalMeals, 0);
      summary.textContent = `${labels.length} label${labels.length !== 1 ? "s" : ""} to print `
        + `&middot; ${totalMeals} meals across ${orders.length} customer${orders.length !== 1 ? "s" : ""}`;
      summary.innerHTML = summary.textContent;

      labels.forEach(label => grid.appendChild(renderLabel(label)));

      // DK-2251 is CONTINUOUS tape: 62mm across, and we choose the length. Every label in a run gets
      // the same length, sized to the TALLEST one actually rendered, so nothing is ever clipped.
      // Measured rather thancounted from line count: a long meal name wraps to two lines (PROTEIN
      // BAKED ZITI (MAINTAIN) does), and a per-line formula silently loses the bottom of the list.
      // The preview renders at the same 62mm width as the print, so the measurement transfers.
      const tallestPx = [...grid.children].reduce((m, el) => Math.max(m, el.scrollHeight), 0);
      const heightMm = Math.max(40, Math.ceil((tallestPx / 96) * 25.4) + 4);   // +4mm headroom
      document.getElementById("pageSize").textContent =
        `@media print { @page { size: 62mm ${heightMm}mm; margin: 0; } .label { height: ${heightMm}mm; } }`;
    }

    // Clear the old DK-2251 tape preference so a device that once picked 62mm isn't carrying dead state.
    localStorage.removeItem("gt_label_stock");

    // Set date picker default to upcoming Sunday, then render
    const dateInput = document.getElementById("prep-date");
    dateInput.value = upcomingSunday();
    dateInput.addEventListener("change", renderAll);

    renderAll();
  </script>
</body>
</html>
